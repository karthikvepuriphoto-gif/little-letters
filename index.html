<!DOCTYPE html>
<html lang="en"><head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overscroll-behavior:none;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(#fff0f6,#e3f2fd);color:#4a3b6b;-webkit-touch-callout:none}
button{font-family:inherit;border:0;border-radius:22px;background:#fff;color:#4a3b6b;font-size:28px;min-width:64px;min-height:64px;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
button.on{outline:5px solid #ff4fa3}
.scr{display:none;position:fixed;inset:0;padding:env(safe-area-inset-top) 14px 14px;overflow:auto;flex-direction:column}
.scr.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.bar .sp{flex:1}
.stars{font-size:26px;background:#fff;border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
h1{margin:0;font-size:clamp(34px,6vw,60px);color:#ff4fa3;text-shadow:3px 3px 0 #fff}
.hub{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:10px 4px 20px}
.hub button{font-size:clamp(70px,13vw,130px);border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hub button small{font-size:clamp(20px,3vw,30px);font-weight:700}
.c1{background:#ffd6e8}.c2{background:#d6f5ff}.c3{background:#fff3c4}.c4{background:#dcf7d4}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(150%);opacity:0;pointer-events:none;background:#fff;padding:16px 26px;border-radius:30px;font-size:26px;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:.3s;z-index:60}
#toast.show{transform:translateX(-50%);opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;padding:6px 2px 30px}
.tile{font-size:50px;min-height:100px;position:relative;font-weight:700}
.tile.wide{font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px}.tile.wide b{font-size:44px}
.tile.done{background:#fff7d6}.tile.gold{background:#ffe08a}
.tile i{position:absolute;top:4px;right:6px;font-size:22px;font-style:normal}
#ltabs button{font-size:30px;padding:0 22px;font-weight:800}
#trace .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#tpic{font-size:clamp(46px,8vw,80px);max-width:46vw;overflow:hidden;white-space:nowrap;text-overflow:clip;line-height:1.1}
#tword{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:4px}
#tword span{color:#bbb}#tword span.done{color:#43a047}#tword span.now{color:#ff4fa3;text-decoration:underline}
#tmode{font-size:40px}
#tcwrap{flex:1;background:#fff;border-radius:30px;margin:8px 0;box-shadow:inset 0 0 0 6px #ffe0ef;min-height:280px;position:relative}
#tcv,#pcv,#ocv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:30px}
.tbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tbtns button{min-width:84px;min-height:84px;font-size:40px}
.pulse{animation:pulse 1s infinite;background:#b9f6ca}
@keyframes pulse{50%{transform:scale(1.12)}}
.hide{display:none!important}
#draw .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.sw{width:58px;min-width:58px;height:58px;border-radius:50%;border:4px solid #fff}
.st{font-size:32px;min-width:58px;min-height:58px}.st.lock{opacity:.4}
#dsizes button{font-size:0;display:flex;align-items:center;justify-content:center}#dsizes button::after{content:"";background:#4a3b6b;border-radius:50%;width:var(--d);height:var(--d)}
#pcwrap{flex:1;border-radius:30px;position:relative;min-height:300px;box-shadow:inset 0 0 0 6px #e1d5f5;margin:6px 0}
#ocv{pointer-events:none}
#stamps{max-height:140px;overflow:auto}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:10px 2px 30px}
.games button{font-size:80px;min-height:190px;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.games button small{font-size:22px;font-weight:700}
#gtitle{font-size:32px;font-weight:800}
#gprompt{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;min-height:70px;margin:10px 0}
.hear{font-size:40px;min-width:80px;min-height:80px;background:#fff3c4}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;padding:10px}
.ch{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:36px}
.bigch{font-size:90px;font-weight:800;line-height:1}
.ch small{font-size:24px}
.yay{background:#b9f6ca!important;transform:scale(1.06)}
.wig{animation:wig .4s}@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.countbox{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px;font-size:60px}.countbox span{cursor:pointer}.countbox .tapped{filter:drop-shadow(0 0 8px #ffeb3b);transform:scale(1.15)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:10px;max-width:760px;margin:auto;width:100%}
.card{aspect-ratio:3/4;font-size:60px;background:#b39ddb;border-radius:24px}.card span{visibility:hidden;font-weight:800}.card.up{background:#fff}.card.up span{visibility:visible}
.sky{position:relative;height:min(60vh,560px);background:linear-gradient(#bbdefb,#e3f2fd);border-radius:30px;overflow:hidden}
.bal{position:absolute;bottom:-20px;width:110px;height:140px;border-radius:50% 50% 48% 48%;font-size:54px;font-weight:800;color:#fff;animation:float 7s ease-in-out infinite;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-260px)}}
.bal.pop{animation:none;transform:scale(1.6);opacity:0;transition:.3s;pointer-events:none}
#bnext{display:flex;gap:10px;font-size:40px;font-weight:800}#bnext span{background:#fff;border-radius:16px;padding:4px 16px}#bnext span.done{background:#b9f6ca}
#ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding-bottom:30px}.gi{position:relative}.gi img{width:100%;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.15)}.gi button{position:absolute;top:6px;right:6px;min-width:50px;min-height:50px;font-size:24px}
.big{font-size:80px;text-align:center}
#parentBtn{font-size:20px;min-height:52px;padding:0 14px;opacity:.75}#parentBtn.holding{background:#ffe08a;transition:background 1.5s}
#pbody{font-size:20px;padding-bottom:30px}.prow{display:flex;flex-wrap:wrap;gap:6px}.pc{display:inline-block;min-width:44px;padding:8px;text-align:center;border-radius:10px;background:#eee;font-weight:800;color:#999}.pc.m1{background:#fff3c4;color:#8d6e00}.pc.m2{background:#b9f6ca;color:#1b5e20}.pc.wide{min-width:70px}
.mini{font-size:20px;padding:0 18px}
.off{opacity:.5}

#draw .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
#draw button{min-width:60px;min-height:60px;font-size:30px;border-radius:18px}

.lbl{font-size:26px;margin:0 2px 0 8px}
.sw{width:54px;min-width:54px!important;height:54px;min-height:54px!important;border-radius:50%!important;border:4px solid #fff!important}

#wheel{width:150px;height:150px;border-radius:50%;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#pcwrap{flex:1;border-radius:30px;position:relative;min-height:300px;box-shadow:0 0 0 6px #e1d5f5;margin:6px 0;overflow:hidden;touch-action:none}
#bgcv,#pcv,#ocv,#scv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ocv,#scv,#bgcv{pointer-events:none}
#mirrorline{position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed rgba(255,79,163,.5);pointer-events:none}
.bgp{font-size:22px!important}
@media (orientation:landscape){#pal,#dopts{flex-wrap:nowrap!important;overflow-x:auto;touch-action:pan-x}#draw .sw{width:48px;min-width:48px!important;height:48px;min-height:48px!important}#draw button{min-width:54px;min-height:54px;font-size:26px}#draw .bar{padding:6px 0}}

<script>
// Stroke data on a 100x120 box: cap/ascender top y=10, x-height y=50, baseline y=90, descender y=115.
// Each stroke is a string: "x,y x,y ..." for lines, "A cx cy r a0 a1" arcs, "E cx cy rx ry a0 a1" ellipses, joined with "|" in a stroke.
const G={
A:["50,10 15,90","50,10 85,90","30,62 70,62"],
B:["22,10 22,90","22,10 52,10|A 52 30 20 -90 90|52,50 22,50","22,50 55,50|A 55 70 20 -90 90|55,90 22,90"],

K:["22,10 22,90","78,10 22,58","40,45 80,90"],
L:["22,10 22,90 78,90"],
M:["15,90 15,10 50,62 85,10 85,90"],
N:["20,90 20,10 80,90 80,10"],
O:["A 50 50 40 -90 -450"],

Q:["A 50 50 40 -90 -450","60,70 85,95"],

U:["20,10 20,60|A 50 60 30 180 0|80,60 80,10"],
V:["15,10 50,90 85,10"],
W:["10,10 30,90 50,40 70,90 90,10"],
X:["20,10 80,90","80,10 20,90"],
Y:["20,10 50,50","80,10 50,50 50,90"],
Z:["20,10 80,10 20,90 80,90"],
a:["A 50 70 20 0 -360","70,50 70,90"],
b:["30,10 30,90","A 50 70 20 180 540"],
c:["A 55 70 20 -40 -320"],
d:["A 50 70 20 0 -360","70,10 70,90"],
e:["32,70 70,70|A 51 70 19 0 -320"],
f:["A 58 26 16 -30 -180|42,26 42,90","26,50 62,50"],
g:["A 50 70 20 0 -360","70,50 70,100|A 50 100 20 0 160"],
h:["30,10 30,90","30,72|A 50 70 20 180 360|70,70 70,90"],
i:["50,50 50,90","50,34 50,36"],

k:["30,10 30,90","68,50 30,75","44,67 70,90"],
l:["50,10 50,90"],
m:["20,50 20,90","20,66|A 33 66 13 180 360|46,66 46,90","46,66|A 59 66 13 180 360|72,66 72,90"],
n:["30,50 30,90","30,70|A 50 70 20 180 360|70,70 70,90"],
o:["A 50 70 20 -90 -450"],
p:["30,50 30,115","A 50 70 20 180 540"],
q:["A 50 70 20 0 -360","70,50 70,115"],
r:["35,50 35,90","35,70|A 55 70 20 180 300"],
s:["A 50 60 10 -20 -270|A 50 80 10 -90 160"],
t:["50,20 50,90","30,50 70,50"],
u:["30,50 30,70|A 50 70 20 180 0","70,50 70,90"],
v:["30,50 50,90 70,50"],
w:["20,50 35,90 50,60 65,90 80,50"],
x:["30,50 70,90","70,50 30,90"],
y:["30,50 50,90","70,50 40,115"],
z:["30,50 70,50 30,90 70,90"],
0:["E 50 50 28 40 -90 -450"],
1:["35,25 50,10 50,90"],
2:["A 50 32 22 -160 35|68,45 25,90 78,90"],
3:["A 48 30 20 -150 90","A 48 70 20 -90 150"],
4:["65,90 65,10 20,65 82,65"],
5:["72,10 32,10 30,46","A 48 66 22 -125 150"],
6:["68,12 32,60","A 50 67 22 180 540"],
7:["20,10 80,10 40,90"],
8:["A 50 30 19 90 -270","A 50 70 21 -90 270"],
9:["A 50 32 22 0 -360","72,32 72,90"]
};
// Parse one stroke into a dense point list.
function strokePts(s){const pts=[];for(const part of s.split("|")){const t=part.trim().split(/\s+/);
 if(t[0]==="A"||t[0]==="E"){const e=t[0]==="E",cx=+t[1],cy=+t[2],rx=+t[3],ry=e?+t[4]:rx,a0=+t[e?5:4],a1=+t[e?6:5];const n=Math.max(8,Math.ceil(Math.abs(a1-a0)/6));
  for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}}
 else{const p=t.map(v=>v.split(",").map(Number));for(let i=0;i<p.length;i++){if(i===0){pts.push(p[0]);continue}const[a,b]=[p[i-1],p[i]],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/3));for(let k=1;k<=n;k++)pts.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}}}
 return pts}
// Glyph for a character or a number like "12" -> two digits side by side.
function glyph(ch){if(G[ch])return{w:100,strokes:G[ch].map(strokePts)};
 const parts=[...String(ch)];const out=[];parts.forEach((c,i)=>{for(const s of G[c])out.push(strokePts(s).map(([x,y])=>[x*.72+i*68,y]))});return{w:parts.length*68+4,strokes:out}}
"use strict";
// ---------- data ----------
const WORDS_FOR={A:["apple","🍎"],B:["ball","⚽"],C:["cat","🐱"],D:["dog","🐶"],E:["egg","🥚"],F:["fish","🐟"],G:["goat","🐐"],H:["hat","🎩"],I:["igloo","🧊"],J:["jam","🍓"],K:["kite","🪁"],L:["lion","🦁"],M:["moon","🌙"],N:["nest","🪺"],O:["octopus","🐙"],P:["pig","🐷"],Q:["queen","👑"],R:["rainbow","🌈"],S:["sun","☀️"],T:["tree","🌳"],U:["umbrella","☂️"],V:["van","🚐"],W:["whale","🐳"],X:["fox","🦊"],Y:["yo-yo","🪀"],Z:["zebra","🦓"]};
